<svg viewBox="0 0 820 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="820" height="700" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">CloneAI Prototype: Architecture (as implemented)</text>
  <text x="410" y="50" text-anchor="middle" font-size="12" fill="#666">Single-page app: HTML + Tailwind (CDN) + Lucide + vanilla JS, runs fully in the browser</text>

  <!-- Step 1 -->
  <rect x="270" y="68" width="280" height="50" rx="8" fill="#e8f0fe" stroke="#4a78d0"/>
  <text x="410" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3f8a">1. URL Input</text>
  <text x="410" y="107" text-anchor="middle" font-size="12" fill="#1d3f8a">text field + presets (Stripe / Vercel / Linear)</text>
  <line x1="410" y1="118" x2="410" y2="142" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 2 -->
  <rect x="220" y="142" width="380" height="72" rx="8" fill="#e6f6ee" stroke="#3a9a68"/>
  <text x="410" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d5c3d">2. startCloning()  (Analysis + Generation stage)</text>
  <text x="410" y="184" text-anchor="middle" font-size="12" fill="#1d5c3d">Animates 5-step pipeline: URL Analysis → Layout &amp; DOM →</text>
  <text x="410" y="200" text-anchor="middle" font-size="12" fill="#1d5c3d">React Code Gen → Build Validation → Live Preview</text>
  <line x1="410" y1="214" x2="410" y2="238" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- State -->
  <rect x="220" y="238" width="380" height="84" rx="8" fill="#fff4e0" stroke="#d08a1e"/>
  <text x="410" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4a00">3. Site State (in-memory JS variables)</text>
  <text x="410" y="281" text-anchor="middle" font-size="12" fill="#7a4a00">currentThemeColor  |  hasTestimonials</text>
  <text x="410" y="298" text-anchor="middle" font-size="12" fill="#7a4a00">isNavbarSticky  |  currentHeroType</text>
  <text x="410" y="314" text-anchor="middle" font-size="11" fill="#a06a10">(reset to defaults on every new clone)</text>

  <!-- Split arrows -->
  <line x1="330" y1="322" x2="200" y2="358" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="322" x2="620" y2="358" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Preview -->
  <rect x="50" y="358" width="300" height="86" rx="8" fill="#efe9fb" stroke="#7a5bc4"/>
  <text x="200" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f2a7a">4a. renderPreview()</text>
  <text x="200" y="400" text-anchor="middle" font-size="12" fill="#3f2a7a">HTML template string built from state</text>
  <text x="200" y="417" text-anchor="middle" font-size="12" fill="#3f2a7a">→ injected via innerHTML</text>
  <text x="200" y="434" text-anchor="middle" font-size="12" fill="#3f2a7a">Live Preview tab (navbar, hero, footer...)</text>

  <!-- Code -->
  <rect x="470" y="358" width="300" height="86" rx="8" fill="#efe9fb" stroke="#7a5bc4"/>
  <text x="620" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f2a7a">4b. updateCodeOutput()</text>
  <text x="620" y="400" text-anchor="middle" font-size="12" fill="#3f2a7a">Generates TSX (React component) text</text>
  <text x="620" y="417" text-anchor="middle" font-size="12" fill="#3f2a7a">from same state</text>
  <text x="620" y="434" text-anchor="middle" font-size="12" fill="#3f2a7a">React Component (tsx) tab</text>

  <!-- Modify -->
  <rect x="170" y="500" width="480" height="132" rx="8" fill="#e6f4f8" stroke="#2f8aa6"/>
  <text x="410" y="522" text-anchor="middle" font-size="14" font-weight="bold" fill="#14566b">5. AI Prompt Modifier (chat panel)</text>
  <text x="410" y="543" text-anchor="middle" font-size="12" fill="#14566b">Quick prompts or free text → submitPrompt()</text>
  <text x="410" y="562" text-anchor="middle" font-size="12" fill="#14566b">Keyword matching on the prompt:</text>
  <text x="410" y="579" text-anchor="middle" font-size="12" fill="#14566b">"blue/color" → theme  |  "testimonial" → add section</text>
  <text x="410" y="596" text-anchor="middle" font-size="12" fill="#14566b">"sticky/navbar" → sticky nav  |  "bakery/hero" → new hero</text>
  <text x="410" y="617" text-anchor="middle" font-size="12" fill="#14566b">Updates state → re-runs 4a + 4b → chat reply</text>

  <!-- arrows from 4a/4b down to modify (visual link) -->
  <line x1="200" y1="444" x2="260" y2="500" stroke="#444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="620" y1="444" x2="560" y2="500" stroke="#444" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- loop back to state -->
  <path d="M170 566 H20 V280 H220" fill="none" stroke="#2f8aa6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="26" y="425" font-size="12" fill="#2f8aa6" transform="rotate(-90 26 425)">update state</text>

  <!-- Not implemented -->
  <rect x="640" y="90" width="170" height="160" rx="8" fill="#f7f7f7" stroke="#999" stroke-dasharray="5 4"/>
  <text x="725" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Simulated / planned</text>
  <text x="725" y="134" text-anchor="middle" font-size="11" fill="#666">Real page fetch</text>
  <text x="725" y="150" text-anchor="middle" font-size="11" fill="#666">(Playwright / scraping)</text>
  <text x="725" y="172" text-anchor="middle" font-size="11" fill="#666">LLM code generation</text>
  <text x="725" y="194" text-anchor="middle" font-size="11" fill="#666">Real build check +</text>
  <text x="725" y="210" text-anchor="middle" font-size="11" fill="#666">auto-fix loop</text>
  <text x="725" y="232" text-anchor="middle" font-size="11" fill="#666">LLM-based edits</text>
</svg>
